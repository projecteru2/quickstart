---
- name: Ensure agent config directory
  ansible.builtin.file:
    path: "{{ node_docker_config_dir }}"
    state: directory
    mode: '0755'

- name: Render agent config
  ansible.builtin.template:
    src: eru-agent.yaml.j2
    dest: "{{ node_docker_config_dir }}/agent.yaml"
    mode: '0644'

- name: Pull agent image
  ansible.builtin.command: "docker pull {{ node_docker_agent_image }}"
  changed_when: true

- name: Remove the running agent container
  ansible.builtin.command: "docker rm -f {{ node_docker_agent_container_name }}"
  changed_when: true
  when: upgrade

- name: Run agent container
  ansible.builtin.command: >-
    docker run -d
    --name {{ node_docker_agent_container_name }}
    --net host
    --restart always
    --env ERU_HOSTNAME={{ node_docker_name }}
    -v {{ node_docker_config_dir }}:/etc/eru
    -v /var/run/docker.sock:/var/run/docker.sock
    {{ node_docker_agent_image }}
    /usr/bin/eru-agent --config /etc/eru/agent.yaml
  register: node_docker_agent_run
  changed_when: node_docker_agent_run.rc == 0
  failed_when: node_docker_agent_run.rc != 0 and 'Conflict' not in node_docker_agent_run.stderr
