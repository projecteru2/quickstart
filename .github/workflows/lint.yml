name: lint

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ansible
        run: pip install ansible-core ansible-lint

      - name: Syntax check
        run: |
          cp inventory.yml.example inventory.yml
          make check

      - name: Lint
        run: make lint
