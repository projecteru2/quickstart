---
- name: Ensure docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Render docker daemon.json
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Ensure docker service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Drop the -H flag so daemon.json owns the listen addresses
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-eru.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/dockerd
    mode: '0644'
  notify: restart docker
