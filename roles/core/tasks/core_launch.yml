---
- name: Render the core systemd unit
  ansible.builtin.template:
    src: eru-core.service.j2
    dest: "/etc/systemd/system/{{ core_service }}.service"
    mode: '0644'
  notify: Restart core

- name: Launch core
  ansible.builtin.systemd_service:
    name: "{{ core_service }}"
    daemon_reload: true
    state: started
    enabled: true

- name: Wait for core to accept connections
  ansible.builtin.wait_for:
    host: "{{ inventory_hostname }}"
    port: "{{ core_port }}"
    timeout: 60
