---
- name: Ensure the etcd staging directory
  ansible.builtin.file:
    path: "{{ etcd_stage_dir }}"
    state: directory
    mode: '0755'

- name: Unpack the etcd release
  ansible.builtin.unarchive:
    src: "{{ etcd_release_url }}"
    remote_src: true
    dest: "{{ etcd_stage_dir }}"
    extra_opts:
      - --strip-components=1
    creates: "{{ etcd_stage_dir }}/etcd"

- name: Install the etcd binaries
  ansible.builtin.copy:
    src: "{{ etcd_stage_dir }}/{{ item }}"
    remote_src: true
    dest: "/usr/local/bin/{{ item }}"
    mode: '0755'
  loop:
    - etcd
    - etcdctl
  notify: Restart etcd
